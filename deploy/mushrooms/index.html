<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushroom Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 12px; margin-top: 20px; width: 100%; cursor: pointer; font-size: 16px; border-radius: 5px; }
        button:hover { background: #2ecc71; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍄 Mushroom Predictor ☠️</h1>
    <p style="text-align:center">Enter mushroom properties to predict if it is edible or poisonous.</p>
    
    <label>Cap Diameter (cm):</label>
    <input type="number" id="cap_diameter" step="0.1" value="7.0">
    
    <label>Stem Height (cm):</label>
    <input type="number" id="stem_height" step="0.1" value="6.5">
    
    <label>Stem Width (mm):</label>
    <input type="number" id="stem_width" step="0.1" value="12.0">
    
    <label>Gill Color:</label>
    <select id="gill_color">
        <option value="w">White (w)</option>
        <option value="y">Yellow (y)</option>
        <option value="n">Brown (n)</option>
        <option value="p">Pink (p)</option>
        <option value="Unknown">Unknown</option>
    </select>
    
    <label>Habitat:</label>
    <select id="habitat">
        <option value="d">Woods (d)</option>
        <option value="g">Grasses (g)</option>
        <option value="l">Leaves (l)</option>
        <option value="m">Meadows (m)</option>
        <option value="Unknown">Unknown</option>
    </select>
    
    <label>Season:</label>
    <select id="season">
        <option value="a">Autumn (a)</option>
        <option value="u">Summer (u)</option>
        <option value="w">Winter (w)</option>
        <option value="s">Spring (s)</option>
        <option value="Unknown">Unknown</option>
    </select>

    <label>Ring Type:</label>
    <select id="ring_type">
        <option value="f">Flaring (f)</option>
        <option value="e">Evanescent (e)</option>
        <option value="Unknown">Unknown</option>
    </select>

    <label>Cap Shape:</label>
    <select id="cap_shape">
        <option value="x">Convex (x)</option>
        <option value="f">Flat (f)</option>
        <option value="s">Sunken (s)</option>
        <option value="b">Bell (b)</option>
        <option value="Unknown">Unknown</option>
    </select>

    <label>Stem Surface:</label>
    <select id="stem_surface">
        <option value="s">Smooth (s)</option>
        <option value="y">Scaly (y)</option>
        <option value="i">Fibrous (i)</option>
        <option value="Unknown">Unknown</option>
    </select>

    <button onclick="predict()">Predict Edibility</button>

    <div id="result"></div>
</div>

<script>
    async function predict() {
        const data = {
            cap_diameter: parseFloat(document.getElementById('cap_diameter').value),
            stem_height: parseFloat(document.getElementById('stem_height').value),
            stem_width: parseFloat(document.getElementById('stem_width').value),
            gill_color: document.getElementById('gill_color').value,
            habitat: document.getElementById('habitat').value,
            season: document.getElementById('season').value,
            ring_type: document.getElementById('ring_type').value,
            cap_shape: document.getElementById('cap_shape').value,
            stem_surface: document.getElementById('stem_surface').value
        };

        try {
            const response = await fetch('http://localhost:8000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = result.prediction;
            if (result.prediction.includes('Poisonous')) {
                resultDiv.style.color = '#e74c3c';
            } else {
                resultDiv.style.color = '#27ae60';
            }
        } catch (error) {
            document.getElementById('result').innerText = "Error connecting to backend API!";
            document.getElementById('result').style.color = "red";
        }
    }
</script>

</body>
</html>
