name: test-train-package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      official_data:
        description: "Download official Citi Bike months instead of CI demo data"
        required: false
        default: false
        type: boolean
      start_month:
        description: "First official month (YYYY-MM)"
        required: false
        default: "2024-01"
      end_month:
        description: "Last official month (YYYY-MM)"
        required: false
        default: "2024-12"

jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest

      - name: Build deterministic smoke dataset
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.official_data }}
        run: python scripts/make_demo_data.py --output data/processed/trips.parquet --rows 5000

      - name: Download and prepare official data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_data }}
        run: |
          python -m src.data.download --start "${{ inputs.start_month }}" --end "${{ inputs.end_month }}"
          python -m src.data.weather --start "${{ inputs.start_month }}" --end "${{ inputs.end_month }}"
          python -m src.data.prepare

      - name: Train smoke model
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.official_data }}
        run: python -m src.models.train --quick --max-rows 100000

      - name: Train official full-year model
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_data }}
        run: python -m src.models.train --max-rows 500000
      - name: Verify API imports
        run: python -c "from app.main import app; assert app.title"
      - uses: actions/upload-artifact@v4
        with:
          name: duration-model-${{ github.sha }}
          path: |
            models/duration_model.joblib
            models/duration_model.metadata.json
            reports/metrics.csv
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    needs: validate-and-train
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t green-wheels:${{ github.sha }} .
