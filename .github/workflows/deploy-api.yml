name: Deploy model-API naar Oracle VM

# Draait wanneer een pull request naar main wordt gemerged (geaccepteerd) die iets in deploy/
# wijzigt (modellen, API of webpagina's), en handmatig via de knop "Run workflow" op het tabblad Actions.
# Een gesloten pull request die NIET gemerged is, wordt overgeslagen.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Nooit twee deploys tegelijk.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  APP_DIR: deploy                          # map in de repo met app.py, requirements.txt, web/ en de modellen
  VM_HOST: 89.168.73.76
  VM_USER: ubuntu
  REMOTE_DIR: rf-api                       # map op de VM, onder /home/ubuntu

jobs:
  # 1. Welke .pkl-bestanden zijn nieuw, en werkt het model dat de API laadt?
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Bij een merge: precies de gemergede commit, ook als main intussen verder is.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Nieuwe modellen in de pull request zoeken
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq ".[] | select(.status != \"removed\") | select(.filename | startswith(\"$APP_DIR/\") and endswith(\".pkl\")) | .filename" \
            > new_models.txt
          if [ -s new_models.txt ]; then
            echo "Nieuwe of gewijzigde modellen in PR #$PR:"
            cat new_models.txt
            { echo "### Nieuwe modellen in PR #$PR"; sed 's/^/- `/; s/$/`/' new_models.txt; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Geen nieuw .pkl-bestand in PR #$PR; app.py/webpagina worden wel opnieuw gedeployed."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Dependencies installeren
        run: pip install -r "$APP_DIR/requirements.txt" httpx

      - name: Modellen laden en testen
        run: python "$APP_DIR/check_model.py" "$APP_DIR"

      - name: Gebruikt de API de nieuwe modellen?
        if: github.event_name == 'pull_request'
        run: |
          # Per model laadt de API maar een bestand (mushrooms/stacking.pkl, citi_bike/model.pkl).
          # Een nieuw .pkl met een andere naam zou wel naar de VM gaan, maar nooit gebruikt worden.
          used=$(cd "$APP_DIR" && python -W ignore -c "import app; [print(p.resolve().relative_to(app.HERE.resolve()).as_posix()) for p in app.MODEL_PATHS]")
          echo "API laadt:"; echo "$used"
          status=0
          while read -r file; do
            if ! printf '%s\n' "$used" | grep -qxF "${file#"$APP_DIR"/}"; then
              echo "::error file=$file::$file wordt niet gebruikt door de API (die laadt: $(echo $used)). Geef het model dezelfde naam of pas MODEL_PATH aan in de api.py van dat model."
              status=1
            fi
          done < new_models.txt
          exit $status

  # 2. Naar de VM kopieren, herstarten en controleren (met rollback).
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: SSH instellen
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Secret VM_SSH_KEY ontbreekt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh
          # Het secret mag base64 zijn (aanbevolen) of de sleutel als tekst. Regeleinden, spaties en
          # Windows-tekens die bij het kopieren zijn veranderd, worden hieronder hersteld.
          key=$(printf '%s' "$VM_SSH_KEY" | tr -d '\r')
          vorm="tekst"
          if ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            decoded=$(printf '%s' "$key" | tr -d '[:space:]' | base64 -d 2>/dev/null | tr -d '\0\r' || true)
            if printf '%s' "$decoded" | grep -q -- '-----BEGIN'; then key=$decoded; vorm="base64"; fi
          fi
          header=$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z0-9 ]*-----' | head -n 1 || true)
          footer=$(printf '%s' "$key" | grep -o -- '-----END [A-Z0-9 ]*-----' | head -n 1 || true)
          body=$(printf '%s' "$key" | tr '\n' ' ' | sed -e 's/.*-----BEGIN [A-Z0-9 ]*-----//' -e 's/-----END [A-Z0-9 ]*-----.*//' | tr -d '[:space:]')
          { echo "$header"; printf '%s\n' "$body" | fold -w 70; echo "$footer"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! reden=$(ssh-keygen -y -P "" -f ~/.ssh/deploy_key 2>&1 > /dev/null); then
            # Diagnose zonder de sleutel zelf te tonen.
            echo "Lengte van het secret: ${#VM_SSH_KEY} tekens (base64 van een nieuwe sleutel is 532)"
            echo "Herkend als: $vorm; begin gevonden: ${header:-nee}; einde gevonden: ${footer:-nee}"
            echo "Melding van ssh-keygen: $reden"
            case "$key" in
              PuTTY-User-Key-File*) hint="Het secret bevat een PuTTY .ppk-bestand; dat formaat werkt hier niet." ;;
              ssh-ed25519\ *|ssh-rsa\ *|ecdsa-*) hint="Het secret bevat de publieke sleutel (.pub) in plaats van de private." ;;
              *) if [ -z "$header" ]; then hint="Er staat geen sleutel in het secret (geen BEGIN-regel gevonden)."
                 elif [ -z "$footer" ]; then hint="De sleutel is afgekapt: het einde ontbreekt."
                 elif printf '%s' "$reden" | grep -qi passphrase; then hint="De sleutel heeft een wachtwoord; maak er een zonder (ssh-keygen -N \"\")."
                 else hint="De sleutel is beschadigd geraakt bij het kopieren."; fi ;;
            esac
            echo "::error::VM_SSH_KEY is geen geldige private sleutel. $hint Maak het secret opnieuw aan met de uitvoer van: base64 -w0 ~/github_deploy_key"
            exit 1
          fi
          echo "Sleutel geldig ($vorm)."
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host vm"
            echo "  HostName $VM_HOST"
            echo "  User $VM_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Reservekopie van de huidige versie op de VM
        run: |
          ssh vm "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf "$HOME/$REMOTE_DIR.prev"
          mkdir -p "$HOME/$REMOTE_DIR"
          # Alles behalve de venv, inclusief submappen (mushrooms/, citi_bike/, web/).
          rsync -a --exclude venv --exclude __pycache__ "$HOME/$REMOTE_DIR/" "$HOME/$REMOTE_DIR.prev/"
          REMOTE

      - name: Bestanden kopieren
        run: |
          rsync -az --exclude venv --exclude __pycache__ "$APP_DIR"/ "vm:$REMOTE_DIR/"

      - name: Installeren, herstarten en controleren
        run: |
          ssh vm "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -uo pipefail
          cd "$HOME/$REMOTE_DIR"
          [ -x venv/bin/pip ] || python3 -m venv venv

          # Wacht tot de API antwoordt; dat lukt alleen als het model geladen is.
          check() {
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://localhost:8000/health; then return 0; fi
              sleep 3
            done
            return 1
          }

          # Zet de vorige versie terug als de nieuwe niet start.
          rollback() {
            echo "::error::Nieuwe versie start niet; vorige versie wordt teruggezet."
            if ls "$HOME/$REMOTE_DIR.prev/"* >/dev/null 2>&1; then
              # Exact de vorige toestand: ook nieuw toegevoegde bestanden weer weg (venv blijft).
              rsync -a --delete --exclude venv "$HOME/$REMOTE_DIR.prev/" ./
              venv/bin/pip install -q --no-cache-dir -r requirements.txt || true
              sudo systemctl restart rf-api
              if check; then echo "Vorige versie draait weer."; else echo "::error::Ook de vorige versie start niet."; fi
            else
              echo "::error::Geen vorige versie om terug te zetten (eerste deploy)."
            fi
            exit 1
          }

          venv/bin/pip install -q --no-cache-dir -r requirements.txt || rollback
          sudo systemctl restart rf-api
          if ! check; then
            sudo journalctl -u rf-api -n 40 --no-pager
            rollback
          fi

          echo "Nieuwe versie draait:"
          curl -fsS http://localhost:8000/ | head -c 200
          echo
          REMOTE