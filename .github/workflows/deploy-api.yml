name: Deploy model-API naar Oracle VM

# Draait wanneer een pull request naar main wordt gemerged (geaccepteerd) die het model (.pkl),
# de API of de webpagina wijzigt, en handmatig via de knop "Run workflow" op het tabblad Actions.
# Een gesloten pull request die NIET gemerged is, wordt overgeslagen.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "mushrooms/deploy/mushrooms_rf/**"
      - "mushrooms/deploy/check_model.py"
      - "mushrooms/index.html"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Nooit twee deploys tegelijk.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  APP_DIR: mushrooms/deploy/mushrooms_rf   # map in de repo met app.py, requirements.txt en het model (.pkl)
  PAGE: mushrooms/index.html               # webpagina in de repo; leeg laten als die al in APP_DIR staat
  VM_HOST: 89.168.73.76
  VM_USER: ubuntu
  REMOTE_DIR: rf-api                       # map op de VM, onder /home/ubuntu

jobs:
  # 1. Welke .pkl-bestanden zijn nieuw, en werkt het model dat de API laadt?
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Bij een merge: precies de gemergede commit, ook als main intussen verder is.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Nieuwe modellen in de pull request zoeken
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq ".[] | select(.status != \"removed\") | select(.filename | startswith(\"$APP_DIR/\") and endswith(\".pkl\")) | .filename" \
            > new_models.txt
          if [ -s new_models.txt ]; then
            echo "Nieuwe of gewijzigde modellen in PR #$PR:"
            cat new_models.txt
            { echo "### Nieuwe modellen in PR #$PR"; sed 's/^/- `/; s/$/`/' new_models.txt; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Geen nieuw .pkl-bestand in PR #$PR; app.py/webpagina worden wel opnieuw gedeployed."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Dependencies installeren
        run: pip install -r "$APP_DIR/requirements.txt" httpx

      - name: Model laden en testen
        run: python mushrooms/deploy/check_model.py "$APP_DIR"

      - name: Gebruikt de API het nieuwe model?
        if: github.event_name == 'pull_request'
        run: |
          # app.py laadt maar een bestand (MODEL_PATH, standaard stacking.pkl). Een nieuw .pkl met
          # een andere naam zou wel naar de VM gaan, maar nooit gebruikt worden.
          used=$(cd "$APP_DIR" && python -W ignore -c "import app; print(app.MODEL_PATH.name)")
          echo "API laadt: $used"
          status=0
          while read -r file; do
            if [ "$(basename "$file")" != "$used" ]; then
              echo "::error file=$file::$file wordt niet gebruikt door de API (die laadt $used). Geef het model de naam $used of pas MODEL_PATH aan in app.py."
              status=1
            fi
          done < new_models.txt
          exit $status

  # 2. Naar de VM kopieren, herstarten en controleren (met rollback).
  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: SSH instellen
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Secret VM_SSH_KEY ontbreekt (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host vm"
            echo "  HostName $VM_HOST"
            echo "  User $VM_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Reservekopie van de huidige versie op de VM
        run: |
          ssh vm "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf "$HOME/$REMOTE_DIR.prev"
          mkdir -p "$HOME/$REMOTE_DIR" "$HOME/$REMOTE_DIR.prev"
          cd "$HOME/$REMOTE_DIR"
          for f in *.py *.txt *.pkl *.html; do
            if [ -e "$f" ]; then cp -p "$f" "$HOME/$REMOTE_DIR.prev/"; fi
          done
          REMOTE

      - name: Bestanden kopieren
        run: |
          rsync -az --exclude venv --exclude __pycache__ "$APP_DIR"/ "vm:$REMOTE_DIR/"
          if [ -n "$PAGE" ] && [ -f "$PAGE" ]; then
            rsync -az "$PAGE" "vm:$REMOTE_DIR/index.html"
          fi

      - name: Installeren, herstarten en controleren
        run: |
          ssh vm "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'REMOTE'
          set -uo pipefail
          cd "$HOME/$REMOTE_DIR"
          [ -x venv/bin/pip ] || python3 -m venv venv

          # Wacht tot de API antwoordt; dat lukt alleen als het model geladen is.
          check() {
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://localhost:8000/health; then return 0; fi
              sleep 3
            done
            return 1
          }

          # Zet de vorige versie terug als de nieuwe niet start.
          rollback() {
            echo "::error::Nieuwe versie start niet; vorige versie wordt teruggezet."
            if ls "$HOME/$REMOTE_DIR.prev/"* >/dev/null 2>&1; then
              cp -p "$HOME/$REMOTE_DIR.prev/"* .
              venv/bin/pip install -q --no-cache-dir -r requirements.txt || true
              sudo systemctl restart rf-api
              if check; then echo "Vorige versie draait weer."; else echo "::error::Ook de vorige versie start niet."; fi
            else
              echo "::error::Geen vorige versie om terug te zetten (eerste deploy)."
            fi
            exit 1
          }

          venv/bin/pip install -q --no-cache-dir -r requirements.txt || rollback
          sudo systemctl restart rf-api
          if ! check; then
            sudo journalctl -u rf-api -n 40 --no-pager
            rollback
          fi

          echo "Nieuwe versie draait:"
          curl -fsS http://localhost:8000/ | head -c 200
          echo
          REMOTE
