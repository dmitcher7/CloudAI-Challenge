name: Mushroom API Smoke Test

on:
  # Na elke geslaagde deploy, dagelijks, en handmatig.
  workflow_run:
    workflows: ['Deploy model-API naar Oracle VM']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

env:
  API_URL: http://89.168.73.76:8000

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          curl -sf --retry 3 --retry-delay 5 -m 15 "$API_URL/health" | tee health.json
          jq -e '.status == "ok"' health.json

      - name: Model info
        run: |
          curl -sf -m 15 "$API_URL/" | tee info.json
          jq -e '.categorical_features | length > 0' info.json

      - name: Predict example mushroom
        env:
          API_KEY: ${{ secrets.MUSHROOM_API_KEY }}
        run: |
          curl -sf -m 15 -X POST "$API_URL/predict" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d '{
              "cap-diameter": 6,
              "stem-height": 6,
              "stem-width": 6,
              "gill-color": "b",
              "habitat": "d",
              "season": "a",
              "ring-type": "e",
              "cap-shape": "b",
              "stem-surface": "f"
            }' | tee predict.json
          jq -e '(.prediction == 0 or .prediction == 1) and (.probabilities | has("0") and has("1"))' predict.json

      - name: Invalid input is rejected
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST "$API_URL/predict" \
            -H "Content-Type: application/json" -d '{"habitat": "not-a-habitat"}')
          echo "HTTP $status"
          test "$status" = "422"
