name: API Smoke Test

on:
  # Na elke geslaagde deploy, dagelijks, en handmatig.
  workflow_run:
    workflows: ['Deploy model-API naar Oracle VM']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

env:
  API_URL: http://89.168.73.76:8000

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          curl -sf --retry 3 --retry-delay 5 -m 15 "$API_URL/health" | tee health.json
          jq -e '.status == "ok"' health.json

      - name: Webpagina's
        run: |
          for page in / /mushrooms.html /citi_bike_models.html /citi_bike.html /citi_bike_demand.html; do
            curl -sf -m 15 -o /dev/null -w "$page -> %{http_code}\n" "$API_URL$page"
          done

      - name: Model info
        run: |
          curl -sf -m 15 "$API_URL/mushrooms/" | tee info.json
          jq -e '.categorical_features | length > 0' info.json
          curl -sf -m 15 "$API_URL/citi_bike/" | tee citi_info.json
          jq -e '.features | length > 0' citi_info.json
          curl -sf -m 15 "$API_URL/citi_bike_demand/" | tee demand_info.json
          jq -e '(.features | length > 0) and (.zones | length > 0)' demand_info.json

      - name: Predict example mushroom
        env:
          API_KEY: ${{ secrets.MUSHROOM_API_KEY }}
        run: |
          curl -sf -m 15 -X POST "$API_URL/mushrooms/predict" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d '{
              "cap-diameter": 6,
              "stem-height": 6,
              "stem-width": 6,
              "gill-color": "b",
              "habitat": "d",
              "season": "a",
              "ring-type": "e",
              "cap-shape": "b",
              "stem-surface": "f"
            }' | tee predict.json
          jq -e '(.prediction == 0 or .prediction == 1) and (.probabilities | has("0") and has("1"))' predict.json

      - name: Predict example Citi Bike trip
        env:
          API_KEY: ${{ secrets.MUSHROOM_API_KEY }}
        run: |
          curl -sf -m 15 -X POST "$API_URL/citi_bike/predict" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d '{
              "started_at": "2026-06-15T08:30:00",
              "rideable_type": "classic_bike",
              "member_casual": "member",
              "start_station_id": "6140.05",
              "start_lat": 40.74174,
              "start_lng": -73.99416,
              "end_station_id": "5905.12",
              "end_lat": 40.73497,
              "end_lng": -73.99073,
              "temperature_2m": 20,
              "relative_humidity_2m": 60,
              "precipitation": 0,
              "wind_speed_10m": 10
            }' | tee citi_predict.json
          jq -e '.predicted_duration_minutes >= 0 and .predicted_duration_minutes <= 180' citi_predict.json

      - name: Predict example Citi Bike demand
        env:
          API_KEY: ${{ secrets.MUSHROOM_API_KEY }}
        run: |
          curl -sf -m 15 -X POST "$API_URL/citi_bike_demand/predict" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d '{
              "zone": 0,
              "time": "2024-06-11T08:00:00",
              "temperature_c": 20,
              "precipitation_mm": 0,
              "wind_kmh": 10
            }' | tee demand_predict.json
          jq -e '.predicted_trips >= 0' demand_predict.json

      - name: Invalid input is rejected
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST "$API_URL/mushrooms/predict" \
            -H "Content-Type: application/json" -d '{"habitat": "not-a-habitat"}')
          echo "mushrooms: HTTP $status"
          test "$status" = "422"
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST "$API_URL/citi_bike/predict" \
            -H "Content-Type: application/json" -d '{"member_casual": "iemand"}')
          echo "citi_bike: HTTP $status"
          test "$status" = "422"
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST "$API_URL/citi_bike_demand/predict" \
            -H "Content-Type: application/json" -d '{"zone": 0, "time": "geen-datum"}')
          echo "citi_bike_demand: HTTP $status"
          test "$status" = "422"
